<!doctype html>
<html lang="en" class="scroll-smooth motion-reduce:scroll-auto">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="You’re invited to an evening of Christmas joy, a shared meal, and good company.">
    <title>{{ page.title }} | World Prayer Vision Life Healing Center Assembly of God</title>
    <link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title }} | Christmas Gala">
    <meta property="og:description" content="You’re invited to an evening of Christmas joy, a shared meal, and good company.">
    <meta property="og:image" content="https://wpvlhc-gala-2026.ivory-gy.com/assets/images/whatsapp-fb-preview-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title }} | Christmas Gala">
    <meta name="twitter:description" content="You’re invited to an evening of Christmas joy, a shared meal, and good company.">
    <meta name="twitter:image" content="https://wpvlhc-gala-2026.ivory-gy.com/assets/images/whatsapp-fb-preview-image.png">
    <link rel="stylesheet" href="{{ '/assets/css/tailwind.css' | relative_url }}">
    {% if page.gallery_stylesheet %}
    <link rel="stylesheet" href="{{ page.gallery_stylesheet | relative_url }}">
    {% endif %}
  </head>
  <body class="overflow-x-hidden bg-paper font-sans text-ink antialiased motion-reduce:[&_*]:transition-none">
    {{ content }}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/gallery.js' | relative_url }}" defer></script>
  </body>
</html>
